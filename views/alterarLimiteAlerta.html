<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MQ-FIRE - Configuração de Limite</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: #f3f3f3;
    }
  </style>
</head>

<body class="min-h-screen font-sans pb-16">

  <main class="max-w-7xl mx-auto px-6 pt-12">
    <h1 class="text-4xl text-gray-800 mb-10 mt-16">Configuração de Alerta (PPM)</h1>

    <a href="sensores.html" class="text-sm text-red-600 hover:underline mb-6 inline-block">Voltar para Sensores</a>

    <!-- Mensagem de Feedback (Sucesso/Erro) -->
    <div id="mensagem" class="hidden mb-6 p-4 rounded text-sm font-medium"></div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Formulário de Alteração -->
      <div class="bg-white p-6 rounded shadow lg:col-span-1">
        <h2 class="text-xl font-semibold text-gray-700 mb-4">Alterar Limite do Sensor</h2>
        
        <form id="formLimite" onsubmit="salvarLimite(event)" class="space-y-4">
          <div>
            <label for="sensorSelect" class="block text-gray-600 text-sm mb-1">Selecione o Sensor:</label>
            <select id="sensorSelect" onchange="aoSelecionarSensor()" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required>
              <option value="">Carregando sensores...</option>
            </select>
          </div>

          <div>
            <label for="limitePpm" class="block text-gray-600 text-sm mb-1">Novo Limite de Alerta (PPM):</label>
            <input 
              type="number" 
              id="limitePpm" 
              min="1" 
              placeholder="Ex: 300" 
              class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
              required
            />
            <p class="text-xs text-gray-500 mt-1">Se o nível de gás ultrapassar este valor, o alerta será ativado.</p>
          </div>

          <button 
            type="submit" 
            class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded transition-colors"
          >
            Salvar Alteração
          </button>
        </form>
      </div>

      <!-- Tabela Resumo dos Sensores -->
      <div class="bg-white p-6 rounded shadow lg:col-span-2">
        <h2 class="text-xl font-semibold text-gray-700 mb-4">Sensores Cadastrados</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b bg-gray-50">
                <th class="p-3 text-sm font-semibold text-gray-600">ID</th>
                <th class="p-3 text-sm font-semibold text-gray-600">Local / Nome</th>
                <th class="p-3 text-sm font-semibold text-gray-600">Limite Atual (PPM)</th>
              </tr>
            </thead>
            <tbody id="tabelaSensores" class="divide-y divide-gray-200">
              <tr>
                <td colspan="3" class="p-3 text-center text-gray-500">Carregando dados...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </main>

  <script>
  let sensores = [];

  // Busca os sensores do usuário ao carregar a página
  async function carregarSensores() {
    try {
      const res = await fetch("/sensores", { credentials: "include" });
      if (!res.ok) throw new Error("Erro ao buscar sensores");

      sensores = await res.json();
      
      preencherSelect();
      preencherTabela();
    } catch (err) {
      console.error(err);
      exibirMensagem("Não foi possível carregar a lista de sensores.", "erro");
    }
  }

  function preencherSelect() {
    const select = document.getElementById("sensorSelect");
    select.innerHTML = '<option value="">-- Selecione um Sensor --</option>';

    sensores.forEach(sensor => {
      const option = document.createElement("option");
      // Usa o id ou o identificador do sensor
      const idSensor = sensor.id || sensor.identificador;
      const nomeExibicao = sensor.nomeSala || sensor.nome || `Sensor ${idSensor}`;
      
      option.value = idSensor;
      option.textContent = `${nomeExibicao} (ID: ${sensor.identificador || idSensor})`;
      select.appendChild(option);
    });
  }

  function preencherTabela() {
    const tbody = document.getElementById("tabelaSensores");
    tbody.innerHTML = "";

    if (!Array.isArray(sensores) || sensores.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" class="p-3 text-center text-gray-500">Nenhum sensor encontrado.</td></tr>';
      return;
    }

    sensores.forEach(sensor => {
      const tr = document.createElement("tr");
      tr.className = "hover:bg-gray-50";
      
      const idExibicao = sensor.identificador || sensor.id;
      const nomeExibicao = sensor.nomeSala || sensor.nome || "Sem Nome";
      const limiteAtual = sensor.limitePpm ?? sensor.limite_ppm ?? sensor.limite ?? 300; // Valor padrão se não definido

      tr.innerHTML = `
        <td class="p-3 text-gray-700 font-mono text-sm">${idExibicao}</td>
        <td class="p-3 text-gray-800 font-medium">${nomeExibicao}</td>
        <td class="p-3 text-red-600 font-semibold">${limiteAtual} PPM</td>
      `;
      tbody.appendChild(tr);
    });
  }

  // Atualiza o input de limite com o valor atual ao selecionar o sensor
  function aoSelecionarSensor() {
    const sensorId = document.getElementById("sensorSelect").value;
    const inputLimite = document.getElementById("limitePpm");

    const sensor = sensores.find(s => (s.id == sensorId || s.identificador == sensorId));
    if (sensor) {
      inputLimite.value = sensor.limitePpm ?? sensor.limite_ppm ?? sensor.limite ?? "";
    } else {
      inputLimite.value = "";
    }
  }

  // Envia a requisição de atualização para o backend
  async function salvarLimite(event) {
    event.preventDefault();
    
    const sensorId = document.getElementById("sensorSelect").value;
    const novoLimite = document.getElementById("limitePpm").value;

    if (!sensorId || !novoLimite) return;

    try {
      // Faz o PUT para atualizar o limite do sensor
      const res = await fetch(`/sensores/${encodeURIComponent(sensorId)}/limite`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ limitePpm: Number(novoLimite) })
      });

      if (!res.ok) throw new Error("Erro na resposta do servidor");

      exibirMensagem("Limite de alerta atualizado com sucesso!", "sucesso");
      carregarSensores(); // Recarrega os dados atualizados
    } catch (err) {
      console.error(err);
      exibirMensagem("Erro ao atualizar o limite. Verifique se o servidor aceita esta rota.", "erro");
    }
  }

  function exibirMensagem(texto, tipo) {
    const msgDiv = document.getElementById("mensagem");
    msgDiv.textContent = texto;
    msgDiv.classList.remove("hidden", "bg-green-100", "text-green-700", "bg-red-100", "text-red-700");

    if (tipo === "sucesso") {
      msgDiv.classList.add("bg-green-100", "text-green-700");
    } else {
      msgDiv.classList.add("bg-red-100", "text-red-700");
    }
  }

  // Inicializa a busca ao carregar a página
  carregarSensores();
</script>

</body>
</html>
